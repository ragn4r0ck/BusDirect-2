<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BusDirect - Billets</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="tickets.js" defer></script>
</head>
<body class="m-0 bg-white font-sans leading-normal text-[#222]">
  <header class="flex flex-wrap items-center justify-between gap-2.5 border-b border-[#ddd] bg-white px-5 py-3.5">
    <a class="text-[22px] font-bold text-[#222] no-underline" href="index.html">BusDirect</a>
    <nav>
      <a class="mr-[15px] text-sm text-[#666] no-underline hover:text-[#222] md:ml-[18px] md:mr-0" href="index.html">Réservations</a>
      <a class="mr-[15px] border-b-2 border-[#222] pb-[3px] text-sm text-[#222] no-underline md:ml-[18px] md:mr-0" href="billets.html">Billets (<span id="ticket-count">0</span>)</a>
    </nav>
  </header>

  <main class="mx-auto max-w-[1100px] p-5">
    <h1 class="mt-2.5 mb-1 text-3xl font-bold">Billets réservés</h1>
    <p class="mt-0 text-[#666]">Safi → Marrakech - 80 DH par place</p>

    <section class="mt-5 rounded-md border border-[#ddd] bg-white p-5">
      <input id="search" class="my-[15px] w-full max-w-[320px] rounded border border-[#ccc] bg-white p-2 text-sm" type="search" placeholder="Rechercher un passager...">

      <div class="overflow-x-auto">
        <table class="w-full border-collapse bg-white">
          <thead>
            <tr>
              <th class="border-b border-[#eee] bg-[#f7f7f7] p-2.5 text-left text-[13px]">Passager</th>
              <th class="border-b border-[#eee] bg-[#f7f7f7] p-2.5 text-left text-[13px]">Trajet</th>
              <th class="border-b border-[#eee] bg-[#f7f7f7] p-2.5 text-left text-[13px]">Siège</th>
              <th class="border-b border-[#eee] bg-[#f7f7f7] p-2.5 text-left text-[13px]">Tarif</th>
              <th class="border-b border-[#eee] bg-[#f7f7f7] p-2.5 text-left text-[13px]">Action</th>
            </tr>
          </thead>
          <tbody id="ticket-rows"></tbody>
        </table>
      </div>

      <p id="empty" class="hidden p-8 text-center text-[#777]">Aucun billet pour le moment.</p>
      <p id="message" class="mt-3.5 min-h-[22px] text-sm text-[#333]"></p>
    </section>
  </main>

  <footer class="mx-auto max-w-[1100px] px-5 pt-2.5 pb-6 text-[13px] text-[#777]">
    BusDirect - Les réservations sont enregistrées dans ce navigateur.
  </footer>
</body>
</html>
